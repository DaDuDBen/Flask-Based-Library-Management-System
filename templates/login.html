<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h3 class="text-center fw-bold mb-2">Welcome Back</h3>
                    <p class="text-center text-muted mb-4">Sign in to manage your library activity.</p>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-control mb-3" id="username" name="username" placeholder="Enter username" required>

                        <label class="form-label" for="password">Password</label>
                        <input class="form-control mb-4" id="password" name="password" type="password" placeholder="Enter password" required>

                        <button class="btn btn-primary w-100 py-2">Login</button>
                    </form>
                    <p class="text-center mt-4 mb-0 text-muted">
                        No account? <a href="/register" class="text-decoration-none fw-semibold">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
